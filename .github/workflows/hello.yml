name: Hello Github Actions

on:
  push:
    branches:
      - main
    workflow_dispatch:



permissions:
  id-token: write
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test Azure connection
        run: az account show

      - name: Test ACR access
        run: az acr repository list --name jankkodevopsacr

      - name: ACR login
        run: az acr login --name jankkodevopsacr

      - name: Build Docker image
        run: docker build -t jankkodevopsacr.azurecr.io/devops-docker-demo:latest .

      - name: Push Docker image
        run: docker push jankkodevopsacr.azurecr.io/devops-docker-demo:latest
      
      - name: Deploy to Azure Container
        run: az containerapp update --name devops-demo-app --resource-group devops-demo-rg --image jankkkodevopsacr.azurecr.io/devops-docker-demo:latest
