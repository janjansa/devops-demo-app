name: Hello Github Actions

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: {{ secrets.AZURE_CLIENT_ID }}
          tenant-id: {{ secrets.AZURE_TENANT_ID }}
          subscription-id: {{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test Azure connection
        run: az account show

      - name: Build Docker image
        run: docker build -t devops-docker-demo:ci .

      - name: List files
        run: ls -la
